# Runs on every commit against staged files. Install once with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy runs from the project venv rather than an isolated pre-commit env,
  # so it always sees the same dependencies and config as a local `mypy src tests` run.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # `python -m mypy` rather than a bare `mypy`: the console script is a
        # separate shim that can be missing even when the package is installed.
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src, tests]
