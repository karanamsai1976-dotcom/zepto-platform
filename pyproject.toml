[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zepto-platform"
version = "0.1.0"
description = "Data and AI platform: ingestion pipeline, ML analytics, and a retrieval-augmented support assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Karanam Balakrishna" }]

# Shared runtime dependencies -- every module uses these.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
]

[project.optional-dependencies]
ingestion = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=9.0",
    "pandas>=2.2",
]
analytics = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.13",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
assistant = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # ChromaDB's default embedding function runs all-MiniLM-L6-v2 on ONNX
    # Runtime, which it already bundles. Using sentence-transformers instead
    # would pull PyTorch (~2GB) for the same model and the same 384-dimensional
    # vectors, at roughly 34x the per-query cost as v1 used it.
    "chromadb>=0.5",
    "langgraph>=0.2",
    "tenacity>=9.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-requests",
    "types-beautifulsoup4"
]
all = [
    "zepto-platform[ingestion,analytics,assistant]",
]

[project.scripts]
zepto-ingest = "zepto.ingestion.pipeline:main"
zepto-train = "zepto.analytics.run:main"
zepto-serve = "zepto.assistant.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zepto"]

# --- Linting and formatting (replaces flake8 + isort + black) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming conventions
    "UP",   # pyupgrade -- flags outdated syntax
    "B",    # bugbear -- likely bugs
    "SIM",  # simplifications
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts are the point in tests

# --- Type checking ---
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- Tests ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=zepto --cov-report=term-missing"
markers = [
    "integration: tests that touch the network, disk, or external services",
]

[tool.coverage.run]
source = ["src/zepto"]
branch = true

[tool.coverage.report]
show_missing = true
# Ratcheted up as modules are ported. Never lower this to make a build pass --
# add the missing test instead.
fail_under = 90
