name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this job only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The embedding model is ~79MB and is fetched on first use. Caching it
      # keeps CI fast and removes a per-run dependency on an external download.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-all-MiniLM-L6-v2

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingestion,analytics,assistant,dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest
