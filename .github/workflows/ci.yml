name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Third-party actions (docker/*, aquasecurity/*) are pinned to a commit, not a
# tag: a tag is a mutable pointer its owner can repoint, and these run inside the
# job with the job's token. The actions/* ones stay on major tags -- they are
# first-party to the platform already executing the workflow, so pinning them
# defends against nothing that is not already trusted.
#
# Least privilege: this job only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # The embedding model is ~79MB and is fetched on first use. Caching it
      # keeps CI fast and removes a per-run dependency on an external download.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-all-MiniLM-L6-v2

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingestion,analytics,assistant,notebooks,dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest

  image:
    name: Build and scan the service image
    runs-on: ubuntu-latest
    # Only worth the build time once the code itself is known good.
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Loaded into the local daemon rather than pushed: this job proves the
      # image builds and is clean, it does not publish.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          tags: zepto-assistant:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the container actually serves, not merely that it builds. A
      # health check that never runs in CI is a health check nobody trusts.
      - name: Run the container and check it answers
        run: |
          docker run -d --name zepto-ci -p 8000:8000 zepto-assistant:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS -X POST http://127.0.0.1:8000/ask \
            -H 'Content-Type: application/json' \
            -d '{"query":"How much is the delivery fee?"}' \
            | tee /dev/stderr | grep -q '"intent":"policy_question"'
          curl -fsS http://127.0.0.1:8000/metrics | grep -q '^zepto_documents_indexed 8.0$'
          docker rm -f zepto-ci

      # --ignore-unfixed, and the reason matters: the Debian base carries HIGH
      # and CRITICAL advisories with no upstream fix available, so failing on
      # them would mean a permanently red build that no change here can turn
      # green -- which trains people to ignore the scanner. This gates on what
      # is actionable; the rest is recorded in docker/README.md and rechecked
      # when the base image is bumped.
      - name: Scan image for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zepto-assistant:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
